name: Verificar Eden Bridge
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      SDK_REF: 52bed4e91afd678f5d03c881a91be0a75de18a06
    steps:
      - uses: actions/checkout@v4
      - run: make test
      - name: Seleccionar herramientas del SDK
        run: |
          for version in 19 18; do
            if command -v "llvm-config-$version" >/dev/null; then
              bindir=$(llvm-config-$version --bindir)
              if test -x "$bindir/clang" && test -x "$bindir/ld.lld" && test -x "$bindir/llvm-ar"; then
                echo "LLVM_CONFIG=llvm-config-$version" >> "$GITHUB_ENV"
                exit 0
              fi
            fi
          done
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y clang-19 lld-19 llvm-19
          echo LLVM_CONFIG=llvm-config-19 >> "$GITHUB_ENV"
      - name: Compilar SDK fijado
        run: |
          git init "$RUNNER_TEMP/sdk-src"
          git -C "$RUNNER_TEMP/sdk-src" fetch --depth=1 https://github.com/hectorsequera65-ops/sdk.git "$SDK_REF"
          git -C "$RUNNER_TEMP/sdk-src" checkout --detach FETCH_HEAD
          make -C "$RUNNER_TEMP/sdk-src" -j2 LLVM_CONFIG="$LLVM_CONFIG" DESTDIR="$RUNNER_TEMP/sdk" install
      - name: Compilar y comprobar ELF
        run: |
          make ps5 PS5_PAYLOAD_SDK="$RUNNER_TEMP/sdk"
          file build/EdenBridge-PS5.elf
          readelf -hW build/EdenBridge-PS5.elf
          readelf -dW build/EdenBridge-PS5.elf | grep -F libkernel_web.sprx
          (cd build && sha256sum EdenBridge-PS5.elf > EdenBridge-PS5.elf.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: EdenBridge-PS5-experimental
          path: |
            build/EdenBridge-PS5.elf
            build/EdenBridge-PS5.elf.sha256
          if-no-files-found: error
